name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy app evals scripts

      - name: Tool & skill descriptions
        run: python scripts/check_descriptions.py

      - name: Tests (pytest)
        run: pytest -q

      - name: Eval self-check
        run: python evals/run_evals.py --self-check
