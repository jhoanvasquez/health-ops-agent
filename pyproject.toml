[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-ops-agent"
version = "0.1.0"
description = "Autonomous prior-authorization assistant with a custom agent harness and an evaluation system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }

dependencies = [
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # LLM & embeddings
  "anthropic>=0.40",
  "voyageai>=0.3",
  # Database
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  # Queue / cache
  "aio-pika>=9.5",
  "redis>=5.2",
  # Clinical data & documents
  "fhir.resources>=7.1",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  # Observability
  "langfuse>=2.54",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ──────────────────────────────── Ruff ────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "evals", "data", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends)

[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]

# ──────────────────────────────── Mypy ────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "aio_pika.*", "fhir.*", "pdfplumber.*", "langfuse.*", "voyageai.*", "fitz"]
ignore_missing_imports = true

# ──────────────────────────────── Pytest ──────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
