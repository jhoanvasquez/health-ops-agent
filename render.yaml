# Render Blueprint — Prior-Authorization Assistant
#
# Deploys the full stack as infrastructure-as-code. The three secrets live in the
# `health-secrets` env group (entered once in the dashboard, shared by API + worker);
# everything else is wired here. RabbitMQ is external (CloudAMQP) — Render has no
# managed broker. See docs/deploy-render.md for the one-time setup runbook.

envVarGroups:
  - name: health-secrets
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # entered in the dashboard
      - key: VOYAGE_API_KEY
        sync: false
      - key: RABBITMQ_URL
        sync: false # CloudAMQP amqps:// URL

databases:
  - name: health-db
    plan: free
    postgresMajorVersion: "16" # supports CREATE EXTENSION vector (pgvector)

services:
  # --- API (FastAPI) --------------------------------------------------------
  - type: web
    name: health-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Docker runtime overrides the image command with `dockerCommand` (not
    # `startCommand`). Render injects $PORT. Free tier has no preDeployCommand, so
    # migrations run here at startup — `alembic upgrade head` is idempotent.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - fromGroup: health-secrets
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: health-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: health-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to the health-web URL after its first deploy, as a JSON array

  # --- Agent worker (queue consumer) ---------------------------------------
  - type: worker
    name: health-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.workers.case_worker
    envVars:
      - fromGroup: health-secrets
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: health-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: health-redis
          property: connectionString

  # --- Review UI (static Vite build) ---------------------------------------
  - type: web
    name: health-web
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # the health-api public URL, baked in at build time
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # SPA fallback

  # --- Redis / Key Value (idempotency guard) -------------------------------
  - type: keyvalue
    name: health-redis
    plan: free
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: allkeys-lru # idempotency keys carry a TTL; evict safely on pressure
